<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ServiceNow Toolkit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #05080a;
      --bg-panel: #0a0f14;
      --bg-card: #0f161c;
      --bg-hover: #141e28;
      --border-dim: #1a2830;
      --border-bright: #2a3840;
      --text-primary: #e8f0f4;
      --text-secondary: #6a8090;
      --text-dim: #3a4850;
      --accent-cyan: #00d4ff;
      --accent-cyan-dim: rgba(0, 212, 255, 0.15);
      --accent-green: #00ff88;
      --accent-green-dim: rgba(0, 255, 136, 0.1);
      --accent-amber: #ffaa00;
      --accent-amber-dim: rgba(255, 170, 0, 0.1);
      --accent-red: #ff3366;
      --glow-cyan: 0 0 20px rgba(0, 212, 255, 0.4);
      --glow-green: 0 0 15px rgba(0, 255, 136, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: var(--bg-deep);
      color: var(--text-primary);
      width: 340px;
      min-height: 420px;
      overflow: hidden;
      position: relative;
    }

    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.1) 2px,
        rgba(0, 0, 0, 0.1) 4px
      );
      pointer-events: none;
      z-index: 1000;
    }

    /* Grid pattern */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-image:
        linear-gradient(var(--border-dim) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-dim) 1px, transparent 1px);
      background-size: 20px 20px;
      opacity: 0.3;
      pointer-events: none;
      z-index: -1;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    /* Header */
    .header {
      background: linear-gradient(180deg, var(--bg-panel) 0%, var(--bg-deep) 100%);
      border-bottom: 1px solid var(--border-bright);
      padding: 16px;
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
      opacity: 0.6;
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, var(--accent-cyan) 0%, var(--accent-green) 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 14px;
      color: var(--bg-deep);
      box-shadow: var(--glow-cyan);
      position: relative;
    }

    .logo-icon::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
      border-radius: 8px;
      z-index: -1;
      opacity: 0.4;
      filter: blur(4px);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
    }

    .logo-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text-primary);
    }

    .logo-subtitle {
      font-size: 9px;
      color: var(--text-secondary);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .status-indicator {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 9px;
      color: var(--accent-green);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-green);
      border-radius: 50%;
      box-shadow: var(--glow-green);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.9); }
    }

    /* Search */
    .search-wrapper {
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 12px 10px 36px;
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-input::placeholder {
      color: var(--text-dim);
    }

    .search-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px var(--accent-cyan-dim), inset 0 0 20px var(--accent-cyan-dim);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      font-size: 12px;
    }

    /* Bookmarklet List */
    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .list-container::-webkit-scrollbar {
      width: 4px;
    }

    .list-container::-webkit-scrollbar-track {
      background: var(--bg-deep);
    }

    .list-container::-webkit-scrollbar-thumb {
      background: var(--border-bright);
      border-radius: 2px;
    }

    .category {
      margin-bottom: 16px;
    }

    .category:last-child {
      margin-bottom: 0;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      padding: 0 4px;
    }

    .category-label {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-dim);
    }

    .category-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, var(--border-dim), transparent);
    }

    .category-count {
      font-size: 9px;
      color: var(--text-dim);
      background: var(--bg-card);
      padding: 2px 6px;
      border-radius: 3px;
    }

    /* Bookmarklet Item */
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 8px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      position: relative;
      overflow: hidden;
    }

    .item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--accent-cyan);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .item:hover {
      background: var(--bg-hover);
      border-color: var(--border-bright);
      transform: translateX(4px);
    }

    .item:hover::before {
      opacity: 1;
    }

    .item:active {
      transform: translateX(4px) scale(0.98);
    }

    .item-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-panel);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      font-size: 16px;
      flex-shrink: 0;
    }

    .item-content {
      flex: 1;
      min-width: 0;
    }

    .item-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-desc {
      font-size: 10px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-shortcut {
      font-size: 9px;
      font-weight: 600;
      color: var(--accent-amber);
      background: var(--accent-amber-dim);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid rgba(255, 170, 0, 0.2);
      flex-shrink: 0;
    }

    .item-delete {
      opacity: 0;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 14px;
      transition: all 0.15s;
      flex-shrink: 0;
    }

    .item:hover .item-delete {
      opacity: 1;
    }

    .item-delete:hover {
      color: var(--accent-red);
    }

    /* Footer */
    .footer {
      padding: 12px;
      border-top: 1px solid var(--border-dim);
      background: var(--bg-panel);
    }

    .add-btn {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1px dashed var(--border-bright);
      border-radius: 8px;
      color: var(--text-secondary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .add-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      background: var(--accent-cyan-dim);
    }

    .add-btn-icon {
      font-size: 14px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 10, 0.9);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--bg-panel);
      border: 1px solid var(--border-bright);
      border-radius: 12px;
      width: 100%;
      max-height: 90%;
      overflow-y: auto;
      transform: scale(0.9) translateY(20px);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-dim);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--text-primary);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      transition: color 0.15s;
    }

    .modal-close:hover {
      color: var(--accent-red);
    }

    .modal-body {
      padding: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus,
    .form-textarea:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px var(--accent-cyan-dim);
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    .modal-footer {
      padding: 16px;
      border-top: 1px solid var(--border-dim);
      display: flex;
      gap: 8px;
    }

    .btn {
      flex: 1;
      padding: 10px 16px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
    }

    .btn-cancel {
      background: var(--bg-card);
      border: 1px solid var(--border-dim);
      color: var(--text-secondary);
    }

    .btn-cancel:hover {
      background: var(--bg-hover);
      border-color: var(--border-bright);
    }

    .btn-save {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
      color: var(--bg-deep);
    }

    .btn-save:hover {
      box-shadow: var(--glow-cyan);
      transform: translateY(-1px);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-dim);
    }

    .empty-state-icon {
      font-size: 32px;
      margin-bottom: 12px;
      opacity: 0.5;
    }

    /* Animations */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .item {
      animation: slideIn 0.2s ease forwards;
    }

    .item:nth-child(1) { animation-delay: 0ms; }
    .item:nth-child(2) { animation-delay: 30ms; }
    .item:nth-child(3) { animation-delay: 60ms; }
    .item:nth-child(4) { animation-delay: 90ms; }
    .item:nth-child(5) { animation-delay: 120ms; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-row">
        <div class="logo-icon">SN</div>
        <div class="logo-text">
          <div class="logo-title">SERVICENOW</div>
          <div class="logo-subtitle">Developer Toolkit</div>
        </div>
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span>Ready</span>
        </div>
      </div>
      <div class="search-wrapper">
        <span class="search-icon">⌕</span>
        <input type="text" class="search-input" id="search" placeholder="Search tools..." autocomplete="off">
      </div>
    </header>

    <main class="list-container" id="list"></main>

    <footer class="footer">
      <button class="add-btn" id="addBtn">
        <span class="add-btn-icon">+</span>
        <span>Add Custom Tool</span>
      </button>
    </footer>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">NEW CUSTOM TOOL</span>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Tool Name</label>
          <input type="text" class="form-input" id="customName" placeholder="e.g., Clear Cache">
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <input type="text" class="form-input" id="customDesc" placeholder="What does this tool do?">
        </div>
        <div class="form-group">
          <label class="form-label">JavaScript Code</label>
          <textarea class="form-textarea" id="customCode" placeholder="(function() {&#10;  // Your code here&#10;})();"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-cancel" id="cancelBtn">Cancel</button>
        <button class="btn btn-save" id="saveBtn">Save Tool</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
